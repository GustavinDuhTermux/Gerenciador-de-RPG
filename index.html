<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mesa de RPG</title>
<meta name="theme-color" content="#8b2e2e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E⚔️%3C/text%3E%3C/svg%3E">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg:#f6f1e7;--card:#fffdf8;--ink:#2b2118;--mut:#7a6a58;--acc:#8b2e2e;--acc2:#b8892f;--line:#e0d4bf;--ok:#3b7a4a;--bad:#b03a3a;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1511;--card:#251e18;--ink:#efe6d6;--mut:#a69782;--acc:#d9644f;--acc2:#d9a94a;--line:#3a3027;--ok:#6fbf82;--bad:#e57373;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a1511;--card:#251e18;--ink:#efe6d6;--mut:#a69782;--acc:#d9644f;--acc2:#d9a94a;--line:#3a3027;--ok:#6fbf82;--bad:#e57373;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;padding-bottom:96px;background:var(--bg);color:var(--ink);font:16px/1.4 Georgia,"Times New Roman",serif}
header,main{max-width:760px;margin:auto;padding:0 16px}
header{padding-top:16px}
h1{margin:0;font-size:24px;color:var(--acc)}
.hint{color:var(--mut);margin:2px 0 14px;font-size:15px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-size:12px;padding:6px 0;cursor:pointer;border-radius:8px}
nav button span{display:block;font-size:22px}
nav button.on{color:var(--acc);background:var(--bg);font-weight:bold}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:3px}
input,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:80px;resize:vertical}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.b{padding:11px 16px;border:0;border-radius:10px;background:var(--acc);color:#fff;font:inherit;cursor:pointer}
.b.g{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.b.ok{background:var(--ok)}.b.bad{background:var(--bad)}
.b.full{width:100%}
.x{border:0;background:none;color:var(--mut);font-size:20px;cursor:pointer;padding:0 6px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.mut{color:var(--mut);font-size:14px}
.hpbar{height:12px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0}
.hpbar i{display:block;height:100%;background:var(--ok)}
.hpn{font-size:26px;font-weight:bold}
.attrs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.at{border:1px solid var(--line);border-radius:10px;padding:8px 2px;text-align:center;background:var(--bg);color:var(--ink);font:inherit;cursor:pointer}
.at b{display:block;font-size:22px}.at small{color:var(--mut)}
.empty{text-align:center;padding:28px 12px}.empty div{font-size:46px}
.dice{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.dice .b{padding:18px 0;font-size:18px}
.step{display:flex;gap:6px;align-items:center}.step input{text-align:center}.step .b{padding:10px 14px}
.big{font-size:64px;text-align:center;color:var(--acc);line-height:1.1}
.turn{background:var(--acc2);color:#1a1511;border-radius:12px;padding:14px;margin-bottom:12px;text-align:center;font-size:18px}
.cur{border:2px solid var(--acc2)}
details{margin-top:12px}summary{cursor:pointer;color:var(--mut);font-size:14px;padding:4px 0}
.b small{opacity:.85;font-weight:normal;font-size:13px}
.stp{font-weight:bold;margin:12px 0 6px}
#toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:10px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:6;max-width:560px;margin:auto}
#toast.show{opacity:1}
</style>
</head>
<body>
<header><h1 id="ttl"></h1><p class="hint" id="hnt"></p></header>
<main id="app"></main>
<div id="toast"></div>
<nav id="nav"></nav>
<script>
var MULTI=false,MASTER=true,JOG=false,HOST=false,LAST={};
var AT=["Força","Destreza","Constituição","Inteligência","Sabedoria","Carisma"];
var TABS=[["fichas","🧙","Fichas","Seus heróis: vida, atributos e anotações. Toque num atributo para rolar um d20."],["init","⚔️","Combate","Monte a ordem dos turnos e acompanhe a vida de cada um."],["dados","🎲","Dados","Escolha quantos dados e o bônus, depois toque no dado."],["diario","📖","Diário","Registre o que aconteceu em cada sessão."],["mesa","🔗","Mesa","Convide jogadores ou entre na mesa de um mestre."]];
var S={tab:"fichas",chars:[],ini:[],round:1,turn:0,notes:[],hist:[],last:null,form:false,iform:false};
loadLocal();
function save(){if(MULTI)syncPush();if(JOG)return;try{localStorage.setItem("mesa-rpg",JSON.stringify({chars:S.chars,ini:S.ini,round:S.round,turn:S.turn,notes:S.notes,hist:S.hist}));}catch(e){}}
function esc(t){return String(t==null?"":t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]});}
function mod(v){return Math.floor((v-10)/2);}function sg(n){return n>=0?"+"+n:""+n;}
function $(i){return document.getElementById(i);}function val(i){var e=$(i);return e?e.value.trim():"";}
function num(i,d){var n=parseInt(val(i),10);return isNaN(n)?d:n;}
function d(n){return Math.ceil(Math.random()*n);}
function toast(t){var e=$("toast");e.textContent=t;e.className="show";clearTimeout(toast.t);toast.t=setTimeout(function(){e.className="";},2800);}
function go(t){S.tab=t;S.form=false;S.iform=false;render();window.scrollTo(0,0);}
function step(id,n,min){var e=$(id);var v=(parseInt(e.value,10)||0)+n;if(min!=null&&v<min)v=min;e.value=v;}
function render(){
  var T=TABS.filter(function(t){return t[0]===S.tab;})[0];
  $("ttl").textContent=T[1]+" "+T[2];$("hnt").textContent=(MULTI?(MASTER?"🎩 Você é o mestre. ":"🎒 Você é jogador. "):"")+T[3];
  $("nav").innerHTML=TABS.map(function(t){return '<button class="'+(S.tab===t[0]?"on":"")+'" onclick="go(\''+t[0]+'\')"><span>'+t[1]+'</span>'+t[2]+'</button>';}).join("");
  $("app").innerHTML=({fichas:vFichas,init:vInit,dados:vDados,diario:vDiario,mesa:vMesa})[S.tab]();ro();save();
}
/* PERSONAGENS */
function vFichas(){
  var h="";
  if(S.form){
    h+='<div class="card"><b>Novo personagem</b><div class="g2" style="margin-top:10px"><div><label>Nome</label><input id="cn" placeholder="Ex.: Aria"></div><div><label>Classe e raça</label><input id="cc" placeholder="Ex.: Ladina elfa"></div></div>'
    +'<div class="g3"><div><label>Nível</label><input id="cl" type="number" value="1"></div><div><label>Vida máxima</label><input id="ch" type="number" value="10"></div><div><label>Armadura (CA)</label><input id="ca" type="number" value="10"></div></div>'
    +'<label>Atributos (padrão 10)</label><div class="g3">'+AT.map(function(a,i){return '<div><label>'+a+'</label><input id="a'+i+'" type="number" value="10"></div>';}).join("")+'</div>'
    +'<div class="row"><button class="b" onclick="addChar()">Salvar personagem</button><button class="b g" onclick="S.form=false;render()">Cancelar</button></div></div>';
  }else if(!S.chars.length){
    h+='<div class="card empty"><div>🧙</div><p><b>Nenhum personagem ainda</b><br><span class="mut">Crie o primeiro ou veja um exemplo pronto.</span></p><button class="b full" onclick="S.form=true;render()">+ Criar personagem</button><p><button class="b g full" onclick="example()">Ver um exemplo pronto</button></p></div>';
  }else if(!MULTI||MASTER)h+='<button class="b full" style="margin-bottom:12px" onclick="S.form=true;render()">+ Novo personagem</button>';
  S.chars.forEach(function(c,i){
    var p=Math.max(0,Math.min(100,c.hp/c.max*100));
    h+='<div class="card"><div class="top"><div><b>'+esc(c.name)+'</b>'+(PEERS[c.id]?' 🟢':'')+'<div class="mut">'+esc(c.cls)+' · nível '+c.lvl+' · 🛡 CA '+c.ac+'</div></div><button class="x" title="Remover" onclick="delChar('+i+')">✕</button></div>'
    +'<div class="hpn">❤ '+c.hp+' <span class="mut">/ '+c.max+'</span></div><div class="hpbar"><i style="width:'+p+'%"></i></div>'
    +'<div class="row"><div class="step" style="flex:1"><label style="margin:0">Valor</label><input id="v'+i+'" type="number" value="1" min="1" style="width:80px"></div><button class="b bad" onclick="hp('+i+',-1)">Dano</button><button class="b ok" onclick="hp('+i+',1)">Cura</button></div>'
    +'<div class="attrs">'+c.at.map(function(v,j){return '<button class="at" onclick="rollAt('+i+','+j+')"><small>'+AT[j].slice(0,3).toUpperCase()+'</small><b>'+sg(mod(v))+'</b><small>'+v+'</small></button>';}).join("")+'</div>'
    +'<div class="mut" style="margin-top:6px">Toque num atributo para rolar d20.</div>'
    +'<div style="margin-top:10px"><label>Anotações (inventário, magias...)</label><textarea onchange="S.chars['+i+'].note=this.value;save()">'+esc(c.note||"")+'</textarea></div></div>';
  });
  return h;
}
function addChar(){var n=val("cn");if(!n){toast("Dê um nome ao personagem.");return;}var m=Math.max(1,num("ch",10));
  S.chars.push({id:newId(),name:n,cls:val("cc"),lvl:num("cl",1),max:m,hp:m,ac:num("ca",10),at:AT.map(function(a,i){return num("a"+i,10);}),note:""});S.form=false;render();toast(n+" entrou na mesa!");}
function example(){S.chars.push({id:newId(),name:"Aria",cls:"Ladina elfa",lvl:3,max:22,hp:22,ac:15,at:[8,16,12,13,12,14],note:"Adaga, arco curto, ferramentas de ladrão"});render();}
function delChar(i){if(confirm("Remover "+S.chars[i].name+"?")){S.chars.splice(i,1);render();}}
function hp(i,s){var c=S.chars[i],v=Math.max(1,num("v"+i,1));c.hp=Math.max(0,Math.min(c.max,c.hp+s*v));render();if(c.hp===0)toast(c.name+" caiu!");}
function rollAt(i,j){var c=S.chars[i],r=d(20),m=mod(c.at[j]);toast(c.name+" · "+AT[j]+": "+r+" "+sg(m)+" = "+(r+m)+(r===20?" 🎉 CRÍTICO!":r===1?" 💀 falha crítica":""));}
/* COMBATE */
function vInit(){
  var h="";
  if(S.ini.length){
    var cur=S.ini[S.turn]||S.ini[0];
    h+='<div class="turn">Rodada '+S.round+' · Vez de <b>'+esc(cur.name)+'</b></div><button class="b full" style="margin-bottom:12px" onclick="nextTurn()">Próximo turno ▶</button>';
  }
  if(S.iform){
    h+='<div class="card"><b>Adicionar monstro ou NPC</b><div class="g3" style="margin-top:10px"><div><label>Nome</label><input id="in" placeholder="Goblin"></div><div><label>Iniciativa</label><div class="row" style="flex-wrap:nowrap"><input id="ii" type="number" placeholder="vazio = rola"><button class="b g" style="padding:10px" onclick="$(\'ii\').value=d(20)">🎲</button></div></div><div><label>Vida (opcional)</label><input id="ih" type="number"></div></div>'
    +'<div class="row"><button class="b" onclick="addIni()">Adicionar</button><button class="b g" onclick="S.iform=false;render()">Cancelar</button></div></div>';
  }else{
    h+='<div class="row" style="margin-bottom:12px"><button class="b" style="flex:1" onclick="impChars()">👥 Adicionar meus personagens</button><button class="b g" style="flex:1" onclick="S.iform=true;render()">+ Monstro / NPC</button></div>';
    if(!S.ini.length)h+='<div class="card empty"><div>⚔️</div><p class="mut">Nenhum combate em andamento.<br>Adicione seus personagens (a iniciativa é rolada sozinha) e depois os monstros.</p></div>';
  }
  S.ini.forEach(function(x,i){
    h+='<div class="card '+(i===S.turn?"cur":"")+'"><div class="top"><div><b>'+esc(x.name)+'</b> <span class="mut">· iniciativa '+x.init+'</span></div><button class="x" title="Remover" onclick="S.ini.splice('+i+',1);if(+i<S.turn)S.turn--;if(S.turn>=S.ini.length)S.turn=0;render()">✕</button></div>'
    +(x.hp!=null?'<div class="row" style="margin-top:6px"><span class="hpn">❤ '+x.hp+'</span><button class="b bad" style="margin-left:auto" onclick="iHp('+i+',-1)">− 1</button><button class="b bad" onclick="iHp('+i+',-5)">− 5</button><button class="b ok" onclick="iHp('+i+',1)">+ 1</button></div>':'')+'</div>';
  });
  if(S.ini.length)h+='<button class="b g full" onclick="if(confirm(\'Encerrar o combate?\')){S.ini=[];S.turn=0;S.round=1;render();}">Encerrar combate</button>';
  return h;
}
function sortIni(){S.ini.sort(function(a,b){return b.init-a.init;});S.turn=0;}
function addIni(){var n=val("in");if(!n){toast("Dê um nome.");return;}var h=val("ih"),i=val("ii");
  S.ini.push({name:n,init:i===""?d(20):parseInt(i,10),hp:h===""?null:parseInt(h,10)});sortIni();S.iform=false;render();}
function impChars(){if(!S.chars.length){toast("Crie um personagem primeiro na aba Personagens.");return;}
  S.chars.forEach(function(c){S.ini.push({name:c.name,init:d(20)+mod(c.at[1]),hp:c.hp});});sortIni();render();}
function nextTurn(){S.turn++;if(S.turn>=S.ini.length){S.turn=0;S.round++;}render();}
function iHp(i,n){S.ini[i].hp=Math.max(0,S.ini[i].hp+n);render();}
/* DADOS */
function vDados(){
  var l=S.last;
  var h='<div class="card"><div class="g2"><div><label>Quantos dados</label><div class="step"><button class="b g" onclick="step(\'dq\',-1,1)">−</button><input id="dq" type="number" value="1"><button class="b g" onclick="step(\'dq\',1,1)">+</button></div></div>'
  +'<div><label>Bônus</label><div class="step"><button class="b g" onclick="step(\'dm\',-1)">−</button><input id="dm" type="number" value="0"><button class="b g" onclick="step(\'dm\',1)">+</button></div></div></div>'
  +'<div class="dice">'+[4,6,8,10,12,20,100].map(function(n){return '<button class="b" onclick="roll('+n+')">d'+n+'</button>';}).join("")+'</div>'
  +(l?'<div class="big">'+l.total+'</div><div class="mut" style="text-align:center">'+esc(l.txt)+'</div>':'<div class="mut" style="text-align:center">O resultado aparece aqui.</div>')+'</div>';
  if(S.hist.length)h+='<div class="card"><div class="top"><b>Últimas rolagens</b><button class="x" style="font-size:14px" onclick="S.hist=[];render()">Limpar</button></div>'+S.hist.map(function(x){return '<div class="mut">'+esc(x)+'</div>';}).join("")+'</div>';
  return h;
}
function roll(n){var q=Math.max(1,Math.min(50,num("dq",1))),m=num("dm",0),r=[],s=0;
  for(var i=0;i<q;i++){var v=d(n);r.push(v);s+=v;}
  var t=q+"d"+n+" → ["+r.join(", ")+"]"+(m?" "+sg(m):"");
  if(n===20&&q===1)t+=r[0]===20?" · 🎉 CRÍTICO!":r[0]===1?" · 💀 falha crítica":"";
  S.last={total:s+m,txt:t};shout(s+m+" ("+t+")");S.hist.unshift((s+m)+"  ("+t+")");S.hist=S.hist.slice(0,12);render();}
/* DIÁRIO */
function vDiario(){
  var h='<div class="card"><label>Título</label><input id="nt" placeholder="Ex.: Sessão 3 – A taverna"><label style="margin-top:10px">O que aconteceu</label><textarea id="nb" placeholder="NPCs, locais, ganchos..."></textarea><div style="margin-top:10px"><button class="b full" onclick="addNote()">Salvar anotação</button></div></div>';
  if(!S.notes.length)h+='<div class="card empty"><div>📖</div><p class="mut">Nenhuma anotação ainda.</p></div>';
  S.notes.forEach(function(n,i){h+='<div class="card"><div class="top"><div><b>'+esc(n.t)+'</b> <span class="mut">· '+esc(n.d)+'</span></div><button class="x" title="Remover" onclick="if(confirm(\'Remover anotação?\')){S.notes.splice('+i+',1);render();}">✕</button></div><div style="white-space:pre-wrap;margin-top:6px">'+esc(n.b)+'</div></div>';});
  return h;
}
function addNote(){var t=val("nt"),b=val("nb");if(!t&&!b){toast("Escreva algo primeiro.");return;}S.notes.unshift({t:t||"Sem título",b:b,d:new Date().toLocaleDateString("pt-BR")});render();toast("Anotação salva.");}
/* MESA COMPARTILHADA (conexao direta entre navegadores, sem servidor) */
var PID="";
function rid(){return Math.random().toString(36).slice(2,12)+Date.now().toString(36);}
try{PID=localStorage.getItem("mesa-pid");if(!PID){PID=rid();localStorage.setItem("mesa-pid",PID);}}catch(e){PID=PID||rid();}
var INV=[],PEERS={},LASTP={},CH=null,JC={code:"",ans:"",state:""};
var CFG={iceServers:[{urls:"stun:stun.l.google.com:19302"}]};
function pj(o){return JSON.stringify(o);}
function newId(){return JOG?PID:"n"+Date.now().toString(36);}
function myName(){return MASTER?"Mestre":(S.chars[0]?S.chars[0].name:"Jogador");}
function nm(pid){var c=S.chars.filter(function(c){return c.id===pid;})[0];return c?c.name:"jogador";}
function loadLocal(){S.chars=[];S.ini=[];S.notes=[];S.hist=[];S.round=1;S.turn=0;try{var raw=localStorage.getItem("mesa-rpg");if(raw){var d=JSON.parse(raw);["chars","ini","round","turn","notes","hist"].forEach(function(k){if(d[k]!=null)S[k]=d[k];});}}catch(e){}}
function cleanChar(c,id){function n(v,d,lo,hi){v=parseInt(v,10);if(isNaN(v))v=d;return Math.max(lo,Math.min(hi,v));}var at=Array.isArray(c.at)?c.at.slice(0,6):[];while(at.length<6)at.push(10);var mx=n(c.max,10,1,9999);return {id:id,name:String(c.name||"Sem nome").slice(0,60),cls:String(c.cls||"").slice(0,80),lvl:n(c.lvl,1,1,99),max:mx,hp:Math.min(mx,n(c.hp,mx,0,9999)),ac:n(c.ac,10,0,99),at:at.map(function(v){return n(v,10,1,40);}),note:String(c.note||"").slice(0,5000)};}
function sendJ(ch,o){try{if(ch&&ch.readyState==="open")ch.send(pj(o));}catch(e){}}
function relay(m,except){Object.keys(PEERS).forEach(function(p){if(p!==except)sendJ(PEERS[p],m);});}
function shout(x){if(JOG)sendJ(CH,{t:"roll",who:myName(),txt:x});else if(HOST)relay({t:"roll",who:"Mestre",txt:x});}
/* codigos de convite (comprimidos) */
function b64(u){var s="";for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s);}
function unb64(t){var a=atob(t),u=new Uint8Array(a.length);for(var i=0;i<a.length;i++)u[i]=a.charCodeAt(i);return u;}
function us(t){return t.replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");}
function unus(t){t=t.replace(/-/g,"+").replace(/_/g,"/");while(t.length%4)t+="=";return t;}
async function enc(o){var s=pj(o);try{var st=new Blob([s]).stream().pipeThrough(new CompressionStream("deflate-raw"));return "mesa:R"+us(b64(new Uint8Array(await new Response(st).arrayBuffer())));}catch(e){return "mesa:P"+us(btoa(unescape(encodeURIComponent(s))));}}
async function dec(t){var m=String(t).match(/mesa:([RP][A-Za-z0-9_-]{40,})/);if(!m)throw 0;var k=m[1][0],r=unus(m[1].slice(1));if(k==="R"){var st=new Blob([unb64(r)]).stream().pipeThrough(new DecompressionStream("deflate-raw"));return JSON.parse(await new Response(st).text());}return JSON.parse(decodeURIComponent(escape(atob(r))));}
function copyT(t,msg){function fb(){var e=document.createElement("textarea");e.value=t;e.style.cssText="position:fixed;opacity:0";document.body.appendChild(e);e.select();var ok=false;try{ok=document.execCommand("copy");}catch(x){}e.remove();toast(ok?msg:"Não consegui copiar. Use as opções avançadas.");}if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){toast(msg);},fb);else fb();}
function pasteT(cb){if(navigator.clipboard&&navigator.clipboard.readText)navigator.clipboard.readText().then(function(t){if(!t){toast("A área de transferência está vazia.");return;}cb(t);},function(){toast("Não deu para colar sozinho. Use as opções avançadas.");});else toast("Seu navegador não permite colar sozinho. Use as opções avançadas.");}
function wa(t){window.open("https://wa.me/?text="+encodeURIComponent(t),"_blank");}
function shareT(t){if(navigator.share)navigator.share({text:t}).catch(function(){});else copyT(t,"Copiado!");}
function invMsg(code){var u=location.protocol.indexOf("http")===0?location.origin+location.pathname+"#c="+code:null;return u?"🎲 Entre na minha mesa de RPG! Toque no link:\n"+u:"🎲 Mesa de RPG: no app, vá em Mesa > Sou jogador > Colar convite e cole esta mensagem:\n"+code;}
function ansMsg(code){return "✅ Minha resposta para a mesa de RPG (copie e cole no app, em Mesa > Colar resposta):\n"+code;}
function gathered(pc){return new Promise(function(ok){var done=false,t1=null;function fin(){if(done)return;done=true;clearTimeout(t1);clearTimeout(t2);ok();}var t2=setTimeout(fin,6000);if(pc.iceGatheringState==="complete")return fin();pc.addEventListener("icecandidate",function(e){if(!e.candidate)fin();else if(!t1)t1=setTimeout(fin,1500);});});}
function sdp(pc){return {type:pc.localDescription.type,sdp:pc.localDescription.sdp};}
/* somente leitura para jogadores */
function ro(){
  if(!JOG||S.tab==="fichas"||S.tab==="dados"||S.tab==="mesa")return;
  var a=$("app");a.querySelectorAll("button,input,textarea,label,.empty").forEach(function(e){e.remove();});
  a.querySelectorAll(".row,.card").forEach(function(e){if(!e.textContent.trim())e.remove();});
  if(!a.children.length)a.innerHTML='<div class="card empty"><div>⏳</div><p class="mut">Aguardando o mestre.</p></div>';
}
var softT=null;
function soft(){if(!softT)softT=setTimeout(softGo,30);}
function softGo(){softT=null;var a=document.activeElement;if(S.form||S.iform||(a&&/INPUT|TEXTAREA/.test(a.tagName))){softT=setTimeout(softGo,1500);return;}render();}
/* sincronizacao */
function viewFor(pid){return {chars:S.chars.filter(function(c){return c.id===pid;}),ini:S.ini,round:S.round,turn:S.turn,notes:S.notes.slice(0,50)};}
function hostPush(){Object.keys(PEERS).forEach(function(p){var v=viewFor(p),j=pj(v);if(LASTP[p]!==j){LASTP[p]=j;v.t="state";sendJ(PEERS[p],v);}});}
function playerPush(){
  S.chars.forEach(function(c){var j=pj(c);if(LAST["c"+c.id]!==j){LAST["c"+c.id]=j;sendJ(CH,{t:"char",c:c});}});
  Object.keys(LAST).forEach(function(k){if(k[0]==="c"&&!S.chars.some(function(c){return "c"+c.id===k;})){delete LAST[k];sendJ(CH,{t:"del",id:k.slice(1)});}});
}
function syncPush(){if(JOG)playerPush();else if(HOST)hostPush();}
function applyState(d){
  Object.keys(LAST).forEach(function(k){if(k[0]==="c")delete LAST[k];});
  S.chars=d.chars||[];S.chars.forEach(function(c){LAST["c"+c.id]=pj(c);});
  S.ini=d.ini||[];S.round=d.round||1;S.turn=d.turn||0;S.notes=d.notes||[];soft();
}
/* mestre */
function wireInv(inv){var ch=inv.ch;
  ch.onopen=function(){inv.state="conectado";soft();};
  ch.onclose=function(){inv.state="desconectado";if(inv.pid&&PEERS[inv.pid]===ch)delete PEERS[inv.pid];if(inv.auto&&!inv.pid)dropInv(inv);else soft();};
  ch.onmessage=function(e){try{hostMsg(inv,JSON.parse(e.data));}catch(x){}};
  inv.pc.onconnectionstatechange=function(){if(inv.pc.connectionState==="failed"){if(inv.auto&&!inv.pid)dropInv(inv);else{inv.state="falhou";soft();}}};}
function dropInv(inv){try{inv.pc.close();}catch(e){}INV=INV.filter(function(v){return v!==inv;});soft();}
async function newInvite(){
  if(!window.RTCPeerConnection){toast("Este navegador não suporta a conexão direta.");return;}
  var pc=new RTCPeerConnection(CFG),inv={pc:pc,ch:pc.createDataChannel("mesa"),code:"",ans:"",state:"gerando",pid:null};
  INV.push(inv);HOST=true;MULTI=true;render();wireInv(inv);
  try{await pc.setLocalDescription(await pc.createOffer());await gathered(pc);inv.code=await enc(sdp(pc));inv.state="aguardando";}catch(e){inv.state="erro";}
  render();
}
/* link unico da mesa: ntfy.sh so troca os dados da conexao (oferta/resposta) */
var SIG=window.SIG_BASE||"https://ntfy.sh",ROOM="",ES=null,SEEN={};
try{ROOM=localStorage.getItem("mesa-room")||"";}catch(e){}
function secId(){var a=new Uint8Array(14);crypto.getRandomValues(a);return Array.prototype.map.call(a,function(x){return (x%36).toString(36);}).join("");}
function topic(r){return SIG+"/rpgmesa-"+r;}
function sigPost(r,o){return fetch(topic(r),{method:"POST",body:pj(o)}).catch(function(){});}
function sigListen(r,since,cb){var es=new EventSource(topic(r)+"/sse"+(since?"?since="+since:""));es.onmessage=function(e){try{var d=JSON.parse(e.data);if(d.event==="message")cb(JSON.parse(d.message));}catch(x){}};return es;}
function startHost(){
  HOST=true;MULTI=true;
  if(!ROOM){ROOM=secId();try{localStorage.setItem("mesa-room",ROOM);}catch(e){}}
  if(ES)return;
  ES=sigListen(ROOM,"20s",function(m){if(m&&m.t==="offer"&&typeof m.sid==="string"&&m.sid.length<40&&m.o&&!SEEN[m.sid])onOffer(m);});
}
function stopHost(){if(ES){ES.close();ES=null;}INV.forEach(function(v){try{v.pc.close();}catch(e){}});INV=[];PEERS={};LASTP={};HOST=false;MULTI=JOG;}
function newRoom(){if(ES){ES.close();ES=null;}ROOM=secId();try{localStorage.setItem("mesa-room",ROOM);}catch(e){}startHost();render();toast("Novo link gerado.");}
function roomLink(){return location.protocol.indexOf("http")===0&&ROOM?location.origin+location.pathname+"#m="+ROOM:"";}
function linkMsg(){return "🎲 Entre na minha mesa de RPG! Toque no link:\n"+roomLink();}
function roomFrom(t){var m=String(t).match(/#m=([a-z0-9]{10,40})/);return m?m[1]:null;}
async function onOffer(m){
  SEEN[m.sid]=1;if(INV.length>40)return;
  var off;try{off=await dec(m.o);}catch(e){return;}
  var pc=new RTCPeerConnection(CFG),inv={pc:pc,ch:null,code:"",ans:"",state:"conectando",pid:null,auto:true};
  INV.push(inv);
  pc.ondatachannel=function(e){inv.ch=e.channel;wireInv(inv);};
  pc.onconnectionstatechange=function(){if(pc.connectionState==="failed")dropInv(inv);};
  setTimeout(function(){if(!inv.pid)dropInv(inv);},40000);
  try{await pc.setRemoteDescription(off);await pc.setLocalDescription(await pc.createAnswer());await gathered(pc);sigPost(ROOM,{t:"answer",to:m.sid,a:await enc(sdp(pc))});}catch(e){dropInv(inv);}
}
async function connectInv(i){var v=INV[i];try{await v.pc.setRemoteDescription(await dec(v.ans));v.state="conectando";toast("Conectando...");}catch(e){toast("Código inválido. Confira se copiou inteiro.");}render();}
function delInv(i){var v=INV[i];if(v.state==="conectado"&&!confirm("Desconectar este jogador?"))return;try{v.pc.close();}catch(e){}if(v.pid&&PEERS[v.pid]===v.ch)delete PEERS[v.pid];INV.splice(i,1);render();}
function hostMsg(inv,m){
  if(m.t==="hello"&&m.pid){if(PEERS[m.pid]&&PEERS[m.pid]!==inv.ch)try{PEERS[m.pid].close();}catch(e){}inv.pid=m.pid;PEERS[m.pid]=inv.ch;INV=INV.filter(function(v){if(v!==inv&&v.pid===m.pid){try{v.pc.close();}catch(e){}return false;}return true;});delete LASTP[m.pid];hostPush();soft();return;}
  if(!inv.pid)return;
  if(m.t==="char"&&m.c&&m.c.id===inv.pid){var i=S.chars.findIndex(function(c){return c.id===inv.pid;});var cc=cleanChar(m.c,inv.pid);if(i<0)S.chars.push(cc);else S.chars[i]=cc;LASTP[inv.pid]=pj(viewFor(inv.pid));soft();}
  else if(m.t==="del"&&m.id===inv.pid){S.chars=S.chars.filter(function(c){return c.id!==inv.pid;});LASTP[inv.pid]=pj(viewFor(inv.pid));soft();}
  else if(m.t==="roll"){var w=String(m.who||"?").slice(0,40),x=String(m.txt||"").slice(0,200);toast("🎲 "+w+": "+x);relay({t:"roll",who:w,txt:x},inv.pid);}
}
/* jogador */
async function joinMesa(){
  if(!window.RTCPeerConnection){toast("Este navegador não suporta a conexão direta.");return;}
  var off;try{off=await dec(JC.code);}catch(e){toast("Código inválido. Confira se copiou inteiro.");return;}
  JC.state="gerando";JC.ans="";render();
  var pc=new RTCPeerConnection(CFG);
  pc.ondatachannel=function(e){CH=e.channel;
    CH.onopen=function(){JOG=true;MULTI=true;MASTER=false;HOST=false;S.chars=[];S.ini=[];S.notes=[];S.hist=[];S.round=1;S.turn=0;LAST={};JC={code:"",ans:"",state:""};sendJ(CH,{t:"hello",pid:PID});toast("Conectado à mesa! 🎉");go("fichas");};
    CH.onmessage=function(ev){try{var m=JSON.parse(ev.data);if(m.t==="state")applyState(m);else if(m.t==="roll")toast("🎲 "+m.who+": "+m.txt);}catch(x){}};
    CH.onclose=leave;};
  pc.onconnectionstatechange=function(){var st=pc.connectionState;if(st==="failed"||st==="closed"){if(JOG)leave();else{JC.state="falhou";soft();}}};
  try{await pc.setRemoteDescription(off);await pc.setLocalDescription(await pc.createAnswer());await gathered(pc);JC.ans=await enc(sdp(pc));JC.state="enviar";}catch(e){JC.state="erro";}
  render();
}
var JN={state:"",msg:""},JR="",rejT=null,rejN=0;
try{JR=localStorage.getItem("mesa-join")||"";}catch(e){}
function becomeJog(){JOG=true;MULTI=true;MASTER=false;HOST=false;S.chars=[];S.ini=[];S.notes=[];S.hist=[];S.round=1;S.turn=0;LAST={};JN={state:"",msg:""};JC={code:"",ans:"",state:""};rejN=0;sendJ(CH,{t:"hello",pid:PID});toast("Conectado à mesa! 🎉");go("fichas");}
function scheduleRejoin(){clearTimeout(rejT);if(!JR||JOG)return;rejT=setTimeout(function(){if(JOG||!JR)return;if(document.visibilityState==="visible"&&JN.state!=="conectando")joinRoom(JR);else scheduleRejoin();},Math.min(60000,4000*(1+rejN++)));}
async function joinRoom(r){
  if(JOG||JN.state==="conectando")return;
  if(!window.RTCPeerConnection){JN={state:"falhou",msg:"Este navegador não suporta a conexão direta."};soft();return;}
  JN={state:"conectando",msg:""};JR=r;try{localStorage.setItem("mesa-join",r);}catch(e){}soft();
  var sid=secId(),pc=new RTCPeerConnection(CFG),ch=pc.createDataChannel("mesa"),es=null,dead=false;CH=ch;
  function fail(msg){if(dead)return;dead=true;try{es.close();}catch(e){}try{pc.close();}catch(e){}if(!JOG){JN={state:"falhou",msg:msg};soft();scheduleRejoin();}}
  ch.onopen=function(){dead=true;try{es.close();}catch(e){}becomeJog();};
  ch.onmessage=function(ev){try{var m=JSON.parse(ev.data);if(m.t==="state")applyState(m);else if(m.t==="roll")toast("🎲 "+m.who+": "+m.txt);}catch(x){}};
  ch.onclose=leave;
  pc.onconnectionstatechange=function(){if(pc.connectionState==="failed"){if(JOG)leave();else fail("Não foi possível conectar. Verifique a internet e tente de novo.");}};
  setTimeout(function(){if(!JOG)fail("O mestre não respondeu. Ele está com o app aberto?");},25000);
  try{
    es=sigListen(r,"",async function(m){if(m&&m.t==="answer"&&m.to===sid&&!dead){try{await pc.setRemoteDescription(await dec(m.a));}catch(x){fail("Resposta inválida do mestre.");}}});
    var opened=new Promise(function(ok){es.onopen=ok;setTimeout(ok,2500);});
    await pc.setLocalDescription(await pc.createOffer());await gathered(pc);await opened;
    sigPost(r,{t:"offer",sid:sid,o:await enc(sdp(pc))});
  }catch(e){fail("Não foi possível falar com o serviço de conexão.");}
}
function leave(){
  if(!JOG)return;JOG=false;MASTER=true;MULTI=HOST;LAST={};try{if(CH)CH.close();}catch(e){}CH=null;loadLocal();render();
  if(JR){toast("Conexão perdida. Reconectando...");scheduleRejoin();}else toast("Desconectado da mesa.");
}
function exitMesa(){JR="";try{localStorage.removeItem("mesa-join");}catch(e){}clearTimeout(rejT);JN={state:"",msg:""};leave();}
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&JR&&!JOG&&JN.state!=="conectando")joinRoom(JR);});
/* tela Mesa */
var ROLE="";try{ROLE=localStorage.getItem("mesa-role")||"";}catch(e){}
function setRole(r){ROLE=r;try{localStorage.setItem("mesa-role",r);}catch(e){}if(r==="mestre")startHost();else if(HOST)stopHost();render();}
var ST={gerando:"⏳ Gerando convite...",aguardando:"📨 Aguardando a resposta do jogador",conectando:"🔄 Conectando...",conectado:"🟢 Conectado",desconectado:"⚠️ Desconectado. Remova e gere um novo convite.",erro:"❌ Erro ao gerar o convite",falhou:"❌ Não conectou. Estão na mesma rede? Remova e gere um novo convite."};
function pasteAns(i){pasteT(function(t){INV[i].ans=t;connectInv(i);});}
function expBk(){var b=new Blob([pj({chars:S.chars,ini:S.ini,round:S.round,turn:S.turn,notes:S.notes})],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="mesa-rpg-backup.json";document.body.appendChild(a);a.click();a.remove();toast("Backup salvo nos seus downloads.");}
function impBk(inp){var f=inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(!Array.isArray(d.chars))throw 0;if(!confirm("Substituir os dados atuais pelo backup?"))return;S.chars=d.chars.map(function(c){return cleanChar(c||{},String((c&&c.id)||newId()));});S.ini=Array.isArray(d.ini)?d.ini:[];S.round=d.round||1;S.turn=d.turn||0;S.notes=Array.isArray(d.notes)?d.notes:[];render();toast("Backup restaurado.");}catch(e){toast("Arquivo de backup inválido.");}};r.readAsText(f);}
function manualMestre(){
  var h='<button class="b g full" onclick="newInvite()">+ Gerar convite manual</button>';
  INV.forEach(function(v,i){
    if(v.auto||v.pid)return;
    h+='<div class="card" style="margin-top:10px"><div class="top"><b>Convite manual</b><button class="x" title="Remover" onclick="delInv('+i+')">✕</button></div><div class="mut" style="margin:4px 0">'+ST[v.state]+'</div>';
    if(v.state==="aguardando"||v.state==="conectando"){
      h+='<div class="stp">1️⃣ Envie o convite</div><div class="row"><button class="b" style="flex:1" onclick="wa(invMsg(INV['+i+'].code))">💬 WhatsApp</button><button class="b g" style="flex:1" onclick="copyT(invMsg(INV['+i+'].code),\'Convite copiado!\')">📋 Copiar</button></div>'
      +'<div class="stp">2️⃣ Quando ele responder, copie a resposta e toque aqui</div><button class="b full" onclick="pasteAns('+i+')">📋 Colar resposta e conectar</button>'
      +'<textarea style="margin-top:8px" oninput="INV['+i+'].ans=this.value" onpaste="setTimeout(function(){connectInv('+i+')},60)" placeholder="Ou cole a resposta aqui">'+esc(v.ans)+'</textarea>';
    }
    h+='</div>';
  });
  return h;
}
function mestreView(){
  var link=roomLink(),h='<div class="card"><b>🎩 Link da sua mesa</b>';
  if(link)h+='<p class="mut">Mande este link aos jogadores. É só tocar nele para entrar, sem código nenhum. Deixe esta página aberta durante o jogo.</p><input readonly value="'+esc(link)+'" onclick="this.select()"><div class="row" style="margin-top:8px"><button class="b" style="flex:1" onclick="wa(linkMsg())">💬 WhatsApp</button><button class="b g" style="flex:1" onclick="copyT(linkMsg(),\'Link copiado!\')">📋 Copiar</button></div><div style="margin-top:6px"><button class="x" style="font-size:13px" onclick="if(confirm(\'O link antigo deixará de funcionar para novos jogadores. Gerar um novo?\'))newRoom()">Gerar novo link</button></div>';
  else h+='<p class="mut">O link da mesa só aparece quando o app está publicado na internet (veja o guia do GitHub). Enquanto isso, use o convite manual abaixo.</p>';
  h+='</div><div class="card"><b>👥 Jogadores</b>';
  var n=0;INV.forEach(function(v,i){if(!v.pid)return;n++;h+='<div class="top" style="margin-top:8px"><span>'+(v.state==="conectado"?"🟢":"⚪")+" "+esc(nm(v.pid))+'</span><button class="x" title="Remover" onclick="delInv('+i+')">✕</button></div>';});
  if(!n)h+='<p class="mut">Ninguém entrou ainda. Quando alguém tocar no link, aparece aqui.</p>';
  h+='</div><details class="card"><summary>Sem internet ou o link não funciona? Convite manual</summary><div style="margin-top:10px">'+manualMestre()+'</div></details>';
  return h;
}
function manualJogador(){
  var h='<button class="b g full" onclick="pasteT(function(t){JC.code=t;joinMesa();})">📋 Colar convite manual</button>';
  if(JC.state==="gerando")h+='<div class="mut" style="margin-top:10px">⏳ Preparando sua resposta...</div>';
  if(JC.state==="enviar")h+='<div class="stp">Agora devolva esta resposta ao mestre</div><div class="row"><button class="b" style="flex:1" onclick="wa(ansMsg(JC.ans))">💬 WhatsApp</button><button class="b g" style="flex:1" onclick="copyT(ansMsg(JC.ans),\'Resposta copiada!\')">📋 Copiar</button></div><div class="mut" style="margin-top:8px">Depois é só esperar: esta tela muda sozinha quando o mestre conectar.</div>';
  if(JC.state==="falhou"||JC.state==="erro")h+='<div class="mut" style="margin-top:10px">❌ Não foi possível conectar. Peça um novo convite ao mestre.</div>';
  return h+'<textarea style="margin-top:8px" oninput="JC.code=this.value" onpaste="setTimeout(joinMesa,60)" placeholder="Ou cole o convite aqui">'+esc(JC.code)+'</textarea>';
}
function jogadorView(){
  var h='<div class="card"><b>🎒 Entrar na mesa</b>';
  if(JN.state==="conectando")h+='<p class="mut">⏳ Entrando na mesa do mestre... leva alguns segundos.</p>';
  else{
    if(JN.state==="falhou")h+='<p class="mut">❌ '+esc(JN.msg)+'</p>'+(JR?'<button class="b full" style="margin-bottom:8px" onclick="JN={state:\'\',msg:\'\'};joinRoom(JR)">Tentar de novo</button>':'');
    else h+='<p class="mut">Toque no link que o mestre enviou e você entra na hora. Se preferir, copie o link e toque abaixo.</p>';
    h+='<button class="b '+(JN.state==="falhou"?"g ":"")+'full" onclick="pasteT(function(t){var r=roomFrom(t);if(r)joinRoom(r);else toast(\'Não achei um link de mesa. Copie a mensagem do mestre inteira.\');})">📋 Colar link do mestre</button>';
  }
  return h+'</div><details class="card"><summary>Sem internet? Entrar com convite manual</summary><div style="margin-top:10px">'+manualJogador()+'</div></details>';
}
function vMesa(){
  if(JOG)return '<div class="card"><b>🟢 Você está na mesa do mestre</b><p class="mut">Suas fichas e rolagens aparecem para o mestre. Se a conexão cair, o app tenta voltar sozinho.</p><button class="b g full" onclick="if(confirm(\'Sair da mesa?\'))exitMesa()">Sair da mesa</button></div>';
  if(!ROLE||ROLE==="solo")return '<div class="card empty"><div>🎲</div><b style="font-size:20px">Bem-vindo à Mesa de RPG!</b><p class="mut">Quem é você nesta aventura?</p><button class="b full" style="margin-bottom:10px;padding:16px" onclick="setRole(\'mestre\')">🎩 Sou o mestre<br><small>Crio a mesa e mando um link aos jogadores</small></button><button class="b g full" style="padding:16px" onclick="setRole(\'jogador\')">🎒 Sou jogador<br><small>Recebi um link do mestre</small></button><p><button class="x" style="font-size:14px" onclick="setRole(\'solo\');go(\'fichas\')">Prefiro usar sozinho, sem mesa</button></p></div>';
  var m=ROLE==="mestre",h=m?mestreView():jogadorView();
  h+='<p style="text-align:center"><button class="x" style="font-size:14px" onclick="if(!INV.length||confirm(\'Isso desconecta os jogadores. Continuar?\'))setRole(\''+(m?"jogador":"mestre")+'\')">Trocar para '+(m?"jogador":"mestre")+'</button></p>';
  if(m)h+='<div class="card"><b>💾 Backup da campanha</b><p class="mut">Seus dados ficam só neste aparelho. Guarde uma cópia de vez em quando.</p><div class="row"><button class="b g" style="flex:1" onclick="expBk()">Exportar</button><label class="b g" style="flex:1;margin:0;text-align:center;cursor:pointer;color:var(--ink);font-size:16px">Importar<input type="file" accept=".json" style="display:none" onchange="impBk(this)"></label></div></div>';
  return h;
}
/* abrir pelo link de convite */
if(!ROLE&&!S.chars.length)S.tab="mesa";
function onHash(){
  var h=location.hash,mm=h.match(/^#m=([a-z0-9]{10,40})$/);
  if(mm){ROLE="jogador";try{localStorage.setItem("mesa-role","jogador");}catch(e){}if(HOST)stopHost();S.tab="mesa";JN={state:"",msg:""};try{history.replaceState(null,"",location.pathname+location.search);}catch(e){}setTimeout(function(){joinRoom(mm[1]);},100);return;}
  if(h.indexOf("#c=")!==0)return;
  JC={code:decodeURIComponent(h.slice(3)),ans:"",state:""};ROLE="jogador";try{localStorage.setItem("mesa-role","jogador");}catch(e){}S.tab="mesa";try{history.replaceState(null,"",location.pathname+location.search);}catch(e){}if(!JOG)setTimeout(joinMesa,150);
}
window.addEventListener("hashchange",onHash);
onHash();
if(ROLE==="mestre")startHost();
else if(JR&&!JOG&&JN.state!=="conectando"){ROLE="jogador";setTimeout(function(){joinRoom(JR);},200);}
render();
</script>
